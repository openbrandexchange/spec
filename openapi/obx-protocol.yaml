openapi: 3.1.0
info:
  title: OBX Protocol (read side)
  version: 0.1.0-draft
  summary: How retailers' software discovers a brand node, gets access and pulls product content.
  description: |
    **Normative.** The Open Brand Exchange (OBX) Protocol is the read side of a brand node:
    a retailer's software (shop, PIM, ERP, content hub) discovers the node, requests access,
    authenticates with OAuth2 client credentials and pulls brands, products, variants (with
    GTIN) and final images with role, view, order, rights and AI provenance.

    The prose specification in `docs/protocol.md` is authoritative where this file is silent.
    Key words MUST, SHOULD, MAY are to be interpreted as described in RFC 2119.

    Conventions for every endpoint:
    - JSON is UTF-8, field names are snake_case, timestamps are RFC 3339.
    - Clients MUST ignore unknown fields, unknown enum values and unknown change types.
      Extension fields are prefixed `x-<vendor>-` (for example `x-photopilot-crop`).
    - Errors are `application/problem+json` (RFC 9457) with an `obx_error` code, except the
      OAuth2 token endpoint which uses RFC 6749 error JSON.
    - Responses carry `OBX-Version: 0.1` and rate limit headers (`RateLimit-Limit`,
      `RateLimit-Remaining`, `RateLimit-Reset`); 429 carries `Retry-After`.
    - A retailer never sees more than it could see in the brand's portal: only published
      objects of brands in its grant.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: Open Brand Exchange
    url: https://openbrandexchange.com
servers:
  - url: https://{host}
    description: A brand node (also on the brand's custom domain).
    variables:
      host:
        default: brand.example.org
tags:
  - name: Discovery
    description: Find out what a node offers.
  - name: Access
    description: Request access and obtain tokens.
  - name: Catalog
    description: Brands, products, variants and GTIN lookups.
  - name: Changes
    description: The change feed, the heart of synchronisation.
  - name: Media
    description: Assets and rendition downloads.
  - name: Exports
    description: Bulk exports as NDJSON manifest plus zip parts.
  - name: Webhooks
    description: Optional wake-up calls for consumers.
  - name: Usage
    description: Optional usage events reported back to the brand.
security:
  - oauth2: [catalog:read]
paths:
  /.well-known/obx:
    get:
      tags: [Discovery]
      operationId: getDiscovery
      summary: Discovery document
      description: 'Public. MUST be served with `Access-Control-Allow-Origin: *` and SHOULD be cacheable for 5 minutes.'
      security: []
      responses:
        '200':
          description: The discovery document.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '../schemas/DiscoveryDocument.json'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: '`setup_required`: the node has not completed first-run setup.'
          content:
            application/problem+json:
              schema: {$ref: '../schemas/Problem.json'}

  /obx/v1/access-requests:
    post:
      tags: [Access]
      operationId: createAccessRequest
      summary: Request access (unauthenticated)
      description: |
        Creates a retailer access request that the brand approves or rejects in its admin.
        Unauthenticated and rate limited (RECOMMENDED: 5 per hour per IP). The response is the
        same whether or not the brand already knows the retailer (no enumeration). Nodes whose
        brand disabled requests answer 403 `forbidden`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/AccessRequestInput.json'}
      responses:
        '202':
          description: Request stored. Keep `request_token` to poll the status.
          content:
            application/json:
              schema: {$ref: '../schemas/AccessRequest.json'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/access-requests/{id}:
    get:
      tags: [Access]
      operationId: getAccessRequest
      summary: Poll an access request
      description: |
        Authenticated with the `request_token` from the 202 response as Bearer token.
        After approval with API access the response contains `credentials` with the
        `client_secret` exactly once (first read); later reads return `client_secret: null`
        and `claimed: true`. Poll at most once per minute.
      security:
        - requestToken: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema: {$ref: '../schemas/AccessRequest.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/oauth/token:
    post:
      tags: [Access]
      operationId: createToken
      summary: OAuth2 token endpoint (client credentials)
      description: |
        RFC 6749 section 4.4. Nodes MUST support `client_secret_basic` and MAY support
        `client_secret_post`. `scope` is optional; when absent all scopes of the client are
        granted. Requesting a scope the client does not have yields `invalid_scope`.
        A revoked client or blocked retailer yields `invalid_client`. Access tokens SHOULD
        live 3600 s; there are no refresh tokens (request a new token).
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                scope:
                  type: string
                  description: Space-separated subset of catalog:read media:read media:original usage:write.
                client_id:
                  type: string
                  description: Only for client_secret_post.
                client_secret:
                  type: string
                  description: Only for client_secret_post.
      responses:
        '200':
          description: Access token.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '../schemas/TokenResponse.json'}
        '400':
          description: RFC 6749 error (invalid_request, unsupported_grant_type, invalid_scope).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: RFC 6749 invalid_client (unknown, wrong secret, revoked, retailer blocked).
          headers:
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/grant:
    get:
      tags: [Access]
      operationId: getGrant
      summary: Who am I and what may I see
      responses:
        '200':
          description: The caller's grant.
          content:
            application/json:
              schema: {$ref: '../schemas/Grant.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/changes:
    get:
      tags: [Changes]
      operationId: listChanges
      summary: Change feed
      description: |
        Without `cursor` the node starts a **snapshot**: one `upsert` per currently visible
        object (brands, then products, then variants, then assets), `phase: snapshot`; then the
        feed switches to `phase: live` at the sequence number where the snapshot started.
        With a cursor it returns entries after it. Pages never mix phases; the last snapshot
        page has `has_more: true`.

        Entries are at-least-once: the same object may appear several times, `data` is always
        the CURRENT representation. Deletes are tombstones for anything no longer visible to
        the caller. Tombstones are kept at least 90 days; an older cursor yields 410
        `cursor_expired` (restart without cursor). A `grant` entry with `resync: true` means
        restart without a cursor. `next_cursor` is always returned; poll again later
        (RECOMMENDED: not more often than every 60 s when `has_more` is false, or on a
        `changes.available` webhook).
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {$ref: '../schemas/Common.json#/$defs/Cursor'}
        - name: limit
          in: query
          required: false
          description: Page size, 1-500 (default 100). Nodes MAY return fewer.
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: A page of changes.
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '../schemas/ChangesPage.json'}
        '400': {$ref: '#/components/responses/CursorInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/brands:
    get:
      tags: [Catalog]
      operationId: listBrands
      summary: Brands visible to the caller
      responses:
        '200':
          description: All visible brands (not paginated; a node has few brands).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '../schemas/Brand.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/brands/{id}:
    get:
      tags: [Catalog]
      operationId: getBrand
      summary: One brand
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema: {$ref: '../schemas/Brand.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Products with variants and assets
      description: |
        Keyset-paginated, ordered by `id` ascending. For synchronisation use `/changes`;
        this endpoint is for browsing and targeted reads. Objects outside the caller's grant
        are never returned (unknown ids in `ids` are silently omitted).
      parameters:
        - name: ids
          in: query
          description: Comma-separated product ids (max 100). Other filters are ignored when set.
          schema: {type: string}
        - name: brand_id
          in: query
          schema: {$ref: '../schemas/Common.json#/$defs/Id'}
        - name: updated_since
          in: query
          description: Products whose own data, a variant or an asset changed at or after this time.
          schema: {$ref: '../schemas/Common.json#/$defs/DateTime'}
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '../schemas/ProductDetail.json'}
                  next_cursor:
                    description: null on the last page.
                    oneOf:
                      - {$ref: '../schemas/Common.json#/$defs/Cursor'}
                      - {type: 'null'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/products/{id}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: One product with variants and assets
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The product.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '../schemas/ProductDetail.json'}
        '304':
          description: Not modified (If-None-Match).
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/products:by-gtin:
    get:
      tags: [Catalog]
      operationId: lookupProductsByGtinQuery
      summary: Look up products by GTIN (short lists)
      description: Same as the POST form, for up to 100 codes in the query string.
      parameters:
        - name: gtin
          in: query
          required: true
          description: Comma-separated codes (max 100).
          schema: {type: string}
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema: {$ref: '../schemas/GtinLookupResult.json'}
        '400': {$ref: '#/components/responses/LimitExceeded'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Catalog]
      operationId: lookupProductsByGtin
      summary: Look up products by GTIN (up to 2000)
      description: |
        Each input is trimmed and spaces removed; 8, 12, 13 or 14 digits are normalised to
        GTIN-14 by left-padding zeros and compared with `Variant.gtin`. Check digits are not
        validated here (a wrong check digit simply won't match). Other inputs are `invalid`.
        Duplicate inputs (after normalisation) are reported once. More than 2000 inputs:
        400 `limit_exceeded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gtins]
              properties:
                gtins:
                  type: array
                  maxItems: 2000
                  items: {type: string, maxLength: 64}
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema: {$ref: '../schemas/GtinLookupResult.json'}
        '400': {$ref: '#/components/responses/LimitExceeded'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/assets/{id}:
    get:
      tags: [Media]
      operationId: getAsset
      summary: One asset (fresh rendition URLs)
      description: Use this to refresh expired signed rendition URLs.
      security:
        - oauth2: [media:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The asset.
          content:
            application/json:
              schema: {$ref: '../schemas/Asset.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/assets/{id}/renditions/{name}:
    get:
      tags: [Media]
      operationId: getRendition
      summary: Download a rendition
      description: |
        Authorised by Bearer token (scope media:read; media:original for `original`) OR by a
        valid signature in the URL as handed out in `Rendition.url`. Supports `Range`
        (206), `If-None-Match` (304). `ETag` is the quoted sha256; `OBX-Content-SHA256` is the
        sha256 of the full representation. `original` bytes are served exactly as uploaded
        (embedded C2PA is preserved). Nodes log each download for the brand's statistics.
      security:
        - oauth2: [media:read]
        - signedUrl: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: name
          in: path
          required: true
          schema: {$ref: '../schemas/Common.json#/$defs/RenditionName'}
        - name: Range
          in: header
          required: false
          schema: {type: string}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The bytes.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            OBX-Content-SHA256: {$ref: '#/components/headers/OBX-Content-SHA256'}
            Accept-Ranges:
              schema: {type: string, const: bytes}
            Content-Disposition:
              description: inline; filename="<filename>" (renditions get _web/_square/_thumb before a .jpg extension).
              schema: {type: string}
            Cache-Control:
              description: private, max-age<=3600
              schema: {type: string}
          content:
            image/*:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206':
          description: Partial content.
          headers:
            Content-Range:
              schema: {type: string}
            ETag: {$ref: '#/components/headers/ETag'}
            OBX-Content-SHA256: {$ref: '#/components/headers/OBX-Content-SHA256'}
          content:
            image/*:
              schema: {type: string, contentMediaType: application/octet-stream}
        '304':
          description: Not modified.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: '`insufficient_scope`, `original_not_allowed` or `forbidden` (e.g. expired signature).'
          content:
            application/problem+json:
              schema: {$ref: '../schemas/Problem.json'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416':
          description: Range not satisfiable.
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /obx/v1/exports:
    post:
      tags: [Exports]
      operationId: createExport
      summary: Start a bulk export
      description: |
        Capability `exports`. Asynchronous; poll GET /exports/{id} (RECOMMENDED every 10 s) or
        subscribe to `export.completed`. Nodes MAY limit concurrent exports per client (409
        `conflict` with the running export id in `detail`).
      security:
        - oauth2: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/ExportRequest.json'}
      responses:
        '202':
          description: Export queued.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '../schemas/Export.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /obx/v1/exports/{id}:
    get:
      tags: [Exports]
      operationId: getExport
      summary: Export status
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Export status with manifest and part URLs once succeeded.
          content:
            application/json:
              schema: {$ref: '../schemas/Export.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /obx/v1/exports/{id}/manifest:
    get:
      tags: [Exports]
      operationId: getExportManifest
      summary: Export manifest (NDJSON)
      security:
        - oauth2: [catalog:read]
        - signedUrl: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: One ExportManifestLine per line; first line is the header.
          content:
            application/x-ndjson:
              schema: {$ref: '../schemas/ExportManifestLine.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/ExportExpired'}
  /obx/v1/exports/{id}/parts/{number}:
    get:
      tags: [Exports]
      operationId: getExportPart
      summary: Download a zip part
      security:
        - oauth2: [media:read]
        - signedUrl: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: number
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: Range
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Zip file.
          headers:
            OBX-Content-SHA256: {$ref: '#/components/headers/OBX-Content-SHA256'}
            Accept-Ranges:
              schema: {type: string, const: bytes}
          content:
            application/zip:
              schema: {type: string, contentMediaType: application/zip}
        '206':
          description: Partial content.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/ExportExpired'}

  /obx/v1/usage:
    post:
      tags: [Usage]
      operationId: reportUsage
      summary: Report usage events
      description: Capability `usage`. Organisation-level events only; never personal data. Unknown asset ids are ignored.
      security:
        - oauth2: [usage:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/Usage.json'}
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /obx/v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: The caller's webhook subscriptions
      responses:
        '200':
          description: Subscriptions (secret is null).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '../schemas/WebhookSubscription.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe
      description: |
        Capability `webhooks`. Events for consumers: `changes.available`, `grant.updated`,
        `export.completed`. The URL MUST be https and MUST NOT resolve to a private, loopback or
        link-local address (422 `unsafe_url`). Max 5 subscriptions per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: {$ref: '../schemas/Common.json#/$defs/Url'}
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [changes.available, grant.updated, export.completed]
      responses:
        '201':
          description: Created; `secret` is returned only now.
          content:
            application/json:
              schema: {$ref: '../schemas/WebhookSubscription.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /obx/v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Unsubscribe
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /obx/v1/webhooks/{id}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a webhook.test event now
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Delivery attempt result.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, status]
                properties:
                  delivered: {type: boolean}
                  status:
                    description: HTTP status returned by the receiver, null on network error.
                    type: [integer, 'null']
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

webhooks:
  obxEvent:
    post:
      tags: [Webhooks]
      operationId: receiveObxEvent
      summary: Event delivery to a consumer's webhook URL
      description: |
        Sent by the node to each active subscription. Headers: `OBX-Webhook-Id` (event id),
        `OBX-Webhook-Timestamp` (unix seconds), `OBX-Webhook-Signature: v1=<hex>` where
        hex = HMAC-SHA256(secret, `<timestamp>.<raw body>`). Receivers MUST verify in constant
        time and reject timestamps more than 300 s away. Respond 2xx within 10 s; otherwise the
        node retries with exponential backoff for up to 24 h. Webhooks are wake-up calls:
        always fetch state via /changes.
      parameters:
        - name: OBX-Webhook-Id
          in: header
          required: true
          schema: {type: string}
        - name: OBX-Webhook-Timestamp
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: OBX-Webhook-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^v1=[a-f0-9]{64}(, ?v1=[a-f0-9]{64})*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/WebhookEvent.json'}
      responses:
        '200':
          description: Delivered (any 2xx).
        '400':
          description: Rejected (bad signature or stale timestamp); the node will retry.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Client credentials issued by the brand (admin or approved access request).
      flows:
        clientCredentials:
          tokenUrl: /obx/v1/oauth/token
          scopes:
            catalog:read: Read brands, products, variants, changes, lookups, exports metadata.
            media:read: Download web, square and thumb renditions and export zips.
            media:original: Download original files (only if the brand allows it for this retailer).
            usage:write: Report usage events.
    clientBasic:
      type: http
      scheme: basic
      description: client_id / client_secret (client_secret_basic).
    requestToken:
      type: http
      scheme: bearer
      description: The request_token returned when creating an access request.
    signedUrl:
      type: apiKey
      in: query
      name: sig
      description: Signature query parameters embedded in URLs handed out by the node (with an expiry). Opaque to clients.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: {$ref: '../schemas/Common.json#/$defs/Id'}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {$ref: '../schemas/Common.json#/$defs/Cursor'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeating a request with the same key within 24 h returns the original response.
      schema: {type: string, maxLength: 200}
  headers:
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema: {type: integer}
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema: {type: integer}
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: {type: integer}
    Retry-After:
      description: Seconds to wait.
      schema: {type: integer}
    ETag:
      description: Quoted lowercase hex sha256 of the representation.
      schema: {type: string}
    OBX-Content-SHA256:
      description: Lowercase hex sha256 of the complete representation (not of a range).
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
  schemas:
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string
  responses:
    BadRequest:
      description: '`invalid_request`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    CursorInvalid:
      description: '`cursor_invalid` (malformed or from another node) or `invalid_request`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    LimitExceeded:
      description: '`limit_exceeded` or `invalid_request`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Unauthorized:
      description: '`unauthorized` (no credentials), `invalid_token` (expired/unknown) or `access_revoked` (client revoked or retailer blocked: stop syncing, keep content per your own policy).'
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Forbidden:
      description: '`insufficient_scope`, `forbidden` or `access_revoked`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    NotFound:
      description: '`not_found`. Also used for objects outside the caller''s grant (never 403, no existence leak).'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Conflict:
      description: '`conflict`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    CursorExpired:
      description: '`cursor_expired`: restart /changes without a cursor.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    ExportExpired:
      description: '`export_expired`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    ValidationFailed:
      description: '`validation_failed` with field errors, or `unsafe_url`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    TooManyRequests:
      description: '`rate_limited`.'
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    NotImplemented:
      description: '`not_implemented`: optional capability not offered by this node.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
