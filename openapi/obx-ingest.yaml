openapi: 3.1.0
info:
  title: OBX Ingest API (write side)
  version: 0.1.0-draft
  summary: How a brand's own systems publish content to any OBX node.
  description: |
    **Normative.** The OBX Ingest API lets a brand's automation (PIM/ERP/DAM connector,
    spreadsheet export, the `obx` CLI, a GitHub Action, n8n/Make/Zapier) publish to ANY
    conforming node. It is keyed by the brand's own ids, so every write is an idempotent
    upsert: send the same thing twice and nothing changes (and no change entry is written).

    See `docs/ingest.md` for the full semantics, including exactly how writes appear in the
    OBX Protocol `/changes` feed, and `docs/import-format.md` for the canonical CSV and
    image filename pattern.

    Authentication: `Authorization: Bearer <ingest token>` (tokens start with `obxi_`),
    created in the node admin. Scopes: `ingest:read`, `ingest:write`, `ingest:delete`.
    A token MAY be restricted to some brands; writes outside them fail with 403 `forbidden`.

    Errors are `application/problem+json` with `obx_error` (see `docs/protocol.md#errors`).
    Unknown fields in request bodies MUST be ignored by nodes (forward compatibility) and
    reported as a warning in the result.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: Open Brand Exchange
    url: https://openbrandexchange.com
servers:
  - url: https://{host}/obx/v1/ingest
    variables:
      host:
        default: brand.example.org
tags:
  - name: Info
    description: Token info, limits and rendition requirements.
  - name: Catalog
    description: Idempotent upserts of brands, products, variants and asset metadata, keyed by external id.
  - name: Files
    description: Binary uploads with sha256 dedupe, including resumable multipart uploads.
  - name: Batch
    description: Many operations in one request.
  - name: Imports
    description: Canonical CSV plus images as one job.
  - name: Jobs
    description: Status of asynchronous work.
security:
  - ingestToken: []
paths:
  /:
    get:
      tags: [Info]
      operationId: getIngestInfo
      summary: Token info, limits and rendition requirements
      description: Any scope. Clients SHOULD call this first; `renditions.server_generated=false` means the client must upload web/square/thumb itself.
      responses:
        '200':
          description: Ingest info.
          content:
            application/json:
              schema: {$ref: '../schemas/IngestInfo.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /brands/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Catalog]
      operationId: getIngestBrand
      summary: Read a brand
      responses:
        '200': {$ref: '#/components/responses/Record'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Catalog]
      operationId: putIngestBrand
      summary: Create or replace a brand
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/BrandInput.json'}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '201': {$ref: '#/components/responses/ResultCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Catalog]
      operationId: patchIngestBrand
      summary: Partially update a brand (JSON merge patch)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Catalog]
      operationId: deleteIngestBrand
      summary: Delete a brand
      description: "Requires scope ingest:delete. Fails with 409 `conflict` while the brand still has products (delete or move them first). Idempotent: deleting an unknown id returns 200 with result `unchanged`."
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /products/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Catalog]
      operationId: getIngestProduct
      summary: Read a product
      responses:
        '200': {$ref: '#/components/responses/Record'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Catalog]
      operationId: putIngestProduct
      summary: Create or replace a product
      description: |
        Full replacement: omitted optional fields become null. Exception: an omitted `status`
        keeps the current status (new objects get the node's default status, normally
        `published`), so a nightly sync never re-publishes what someone unpublished by hand
        unless it sends `status` explicitly.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/ProductInput.json'}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '201': {$ref: '#/components/responses/ResultCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Catalog]
      operationId: patchIngestProduct
      summary: Partially update a product (JSON merge patch), e.g. to unpublish
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Catalog]
      operationId: deleteIngestProduct
      summary: Delete a product with its variants and assets
      description: Requires ingest:delete. Emits tombstones for the product and each of its visible variants and assets. Idempotent.
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /products/{external_id}/asset-order:
    put:
      tags: [Catalog]
      operationId: putIngestAssetOrder
      summary: Set the image order of one product colour atomically
      description: |
        Assigns positions 1..n to the listed assets (all non-deleted assets of this product
        and `color_code` MUST be listed; 422 `validation_failed` otherwise). This is how you
        swap or reorder images without `position_conflict`. Emits one asset upsert per asset
        whose position changed.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color_code, asset_external_ids]
              properties:
                color_code:
                  type: [string, 'null']
                  description: null = the product-wide (all colours) assets.
                asset_external_ids:
                  type: array
                  minItems: 1
                  maxItems: 999
                  uniqueItems: true
                  items: {$ref: '../schemas/Common.json#/$defs/ExternalId'}
      responses:
        '200':
          description: One result per listed asset.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '../schemas/IngestResult.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /variants/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Catalog]
      operationId: getIngestVariant
      summary: Read a variant
      responses:
        '200': {$ref: '#/components/responses/Record'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Catalog]
      operationId: putIngestVariant
      summary: Create or replace a variant
      description: The product (`product_external_id`) MUST exist, else 422 `unknown_parent`. GTIN check digit MUST be valid (`invalid_gtin`) and unique in the node (409 `gtin_conflict`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/VariantInput.json'}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '201': {$ref: '#/components/responses/ResultCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Catalog]
      operationId: patchIngestVariant
      summary: Partially update a variant (JSON merge patch)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Catalog]
      operationId: deleteIngestVariant
      summary: Delete a variant
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /assets/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Catalog]
      operationId: getIngestAsset
      summary: Read asset metadata (including missing_files)
      responses:
        '200': {$ref: '#/components/responses/Record'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Catalog]
      operationId: putIngestAsset
      summary: Create or replace asset metadata
      description: |
        The product MUST exist (`unknown_parent`). `position` MUST be free among the product's
        other non-deleted assets of the same `color_code` (409 `position_conflict`; replacing an
        image = reuse its external_id). `files` attaches blobs uploaded earlier (422
        `blob_missing` if a sha256 is unknown); this is the atomic way to replace an original
        together with client-generated renditions. The asset becomes visible once its original
        and all required renditions exist (`visibility: pending_files` until then).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/AssetInput.json'}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '201': {$ref: '#/components/responses/ResultCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Catalog]
      operationId: patchIngestAsset
      summary: Partially update asset metadata (JSON merge patch)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Catalog]
      operationId: deleteIngestAsset
      summary: Delete an asset
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /assets/{external_id}/files/{rendition}:
    put:
      tags: [Files]
      operationId: putIngestAssetFile
      summary: Upload the original or a client-generated rendition
      description: |
        Raw body, `Content-Type` of the file. `OBX-Content-SHA256` is RECOMMENDED; when present
        the node verifies it (422 `checksum_mismatch`). The asset metadata MUST exist (404).
        Uploading the same bytes again is a no-op (`unchanged`).

        Replacing `original` on a node without server-side renditions: the node keeps serving
        the previous original and renditions until all required renditions uploaded AFTER the
        new original are present, then swaps atomically (one asset upsert in /changes).
        Renditions MUST follow the rendition rules (web/thumb: JPEG, longest side <= 2000/600,
        never upscaled; square: web on a white square canvas); nodes MAY reject (422
        `validation_failed`) renditions whose size violates them.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - name: rendition
          in: path
          required: true
          schema: {$ref: '../schemas/Common.json#/$defs/RenditionName'}
        - $ref: '#/components/parameters/ContentSha256'
      requestBody:
        required: true
        content:
          image/*:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200': {$ref: '#/components/responses/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: {$ref: '../schemas/Common.json#/$defs/Sha256'}
    head:
      tags: [Files]
      operationId: headIngestBlob
      summary: Does the node already have these bytes?
      description: Dedupe check before uploading. 200 = present (skip the upload), 404 = upload it.
      responses:
        '200':
          description: Present.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Not present.
    put:
      tags: [Files]
      operationId: putIngestBlob
      summary: Upload bytes (content-addressed)
      description: Raw body. The node verifies the sha256 (422 `checksum_mismatch`). Blobs not referenced by any asset MAY be garbage-collected after 24 h. Bodies larger than `limits.max_upload_bytes` use /uploads.
      requestBody:
        required: true
        content:
          image/*:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: Already present (created=false).
          content:
            application/json:
              schema: {$ref: '../schemas/Blob.json'}
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '../schemas/Blob.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /uploads:
    post:
      tags: [Files]
      operationId: createUpload
      summary: Start a resumable multipart upload
      description: For files above `max_upload_bytes`. If the node already has the sha256 it answers 200 with the Blob and no upload is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, bytes, content_type]
              properties:
                sha256: {$ref: '../schemas/Common.json#/$defs/Sha256'}
                bytes: {type: integer, minimum: 1}
                content_type: {type: string}
      responses:
        '200':
          description: Blob already present.
          content:
            application/json:
              schema: {$ref: '../schemas/Blob.json'}
        '201':
          description: Upload session created.
          content:
            application/json:
              schema: {$ref: '../schemas/Upload.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Files]
      operationId: getUpload
      summary: Upload status (which parts arrived)
      responses:
        '200':
          description: Upload session.
          content:
            application/json:
              schema: {$ref: '../schemas/Upload.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Files]
      operationId: abortUpload
      summary: Abort an upload
      responses:
        '204':
          description: Aborted.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /uploads/{id}/parts/{number}:
    put:
      tags: [Files]
      operationId: putUploadPart
      summary: Upload one part
      description: Idempotent per part number; re-sending a part replaces it. Every part except the last MUST be exactly `part_bytes`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: number
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: Part stored.
          content:
            application/json:
              schema: {$ref: '../schemas/Upload.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /uploads/{id}/complete:
    post:
      tags: [Files]
      operationId: completeUpload
      summary: Assemble the parts into a blob
      description: Verifies size and sha256. Missing parts give 409 `upload_incomplete`; a hash mismatch gives 422 `checksum_mismatch` (the upload is aborted).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The blob.
          content:
            application/json:
              schema: {$ref: '../schemas/Blob.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /batch:
    post:
      tags: [Batch]
      operationId: postIngestBatch
      summary: Many operations in one request
      description: |
        Up to `limits.max_batch_operations` (>= 1000) operations, processed in order, each one
        atomic on its own; a failing operation does not stop the rest. Body: a JSON array of
        IngestOperation, or NDJSON (one operation per line). Binary data is referenced by
        sha256 (upload blobs first). The node answers 200 with all results when it processed
        the batch within the request, or 202 with a job (always when the client sends
        `Prefer: respond-async`). Clients MUST handle both.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Prefer
          in: header
          required: false
          schema: {type: string, enum: [respond-async]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '../schemas/IngestOperation.json'}
          application/x-ndjson:
            schema: {$ref: '../schemas/IngestOperation.json'}
      responses:
        '200':
          description: Processed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
        '202':
          description: Accepted as a job.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '../schemas/IngestJob.json'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /imports:
    post:
      tags: [Imports]
      operationId: postIngestImport
      summary: Import a canonical CSV and/or images as one job
      description: |
        multipart/form-data with any of: `package` (zip with products.csv, optional assets.csv
        and images), `csv` (products.csv), `assets_csv` (assets.csv), `images` (one zip, or
        repeated image files), `images_manifest` (JSON: images already uploaded as blobs,
        referenced by file name + sha256, optionally with client-generated renditions) and
        `options` (JSON). The manifest is how the `obx` CLI and the admin UI avoid re-uploading
        unchanged images: HEAD /blobs/{sha256}, upload only what is missing, then import with
        the manifest. Always asynchronous: 202 + job. Row and file problems are reported as
        ImportRowError results, never as a failed request. See docs/import-format.md.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  contentMediaType: application/zip
                csv:
                  type: string
                  contentMediaType: text/csv
                assets_csv:
                  type: string
                  contentMediaType: text/csv
                images:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                images_manifest:
                  $ref: '#/components/schemas/ImagesManifest'
                options:
                  $ref: '#/components/schemas/ImportOptions'
            encoding:
              options:
                contentType: application/json
              images_manifest:
                contentType: application/json
      responses:
        '202':
          description: Import job queued.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '../schemas/IngestJob.json'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /jobs:
    get:
      tags: [Jobs]
      operationId: listIngestJobs
      summary: Recent jobs of this token's brand node
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [queued, running, succeeded, failed]}
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '../schemas/IngestJob.json'}
                  next_cursor:
                    oneOf:
                      - {$ref: '../schemas/Common.json#/$defs/Cursor'}
                      - {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getIngestJob
      summary: Job status
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: {$ref: '../schemas/IngestJob.json'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /jobs/{id}/results:
    get:
      tags: [Jobs]
      operationId: listIngestJobResults
      summary: Per-operation (batch) or per-row (import) results
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: errors_only
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Results page. Batch jobs return IngestResult items; import jobs ImportRowError items.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      anyOf:
                        - {$ref: '../schemas/IngestResult.json'}
                        - {$ref: '../schemas/ImportRowError.json'}
                  next_cursor:
                    oneOf:
                      - {$ref: '../schemas/Common.json#/$defs/Cursor'}
                      - {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
      description: Brand ingest token (obxi_...), created and revoked in the node admin.
  parameters:
    ExternalId:
      name: external_id
      in: path
      required: true
      description: The brand's own id, percent-encoded.
      schema: {$ref: '../schemas/Common.json#/$defs/ExternalId'}
    IdPath:
      name: id
      in: path
      required: true
      schema: {$ref: '../schemas/Common.json#/$defs/Id'}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {$ref: '../schemas/Common.json#/$defs/Cursor'}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional optimistic concurrency with the record's ETag.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeating a request with the same key within 24 h returns the original response (same job).
      schema: {type: string, maxLength: 200}
    ContentSha256:
      name: OBX-Content-SHA256
      in: header
      required: false
      description: Lowercase hex sha256 of the body; verified when present.
      schema: {$ref: '../schemas/Common.json#/$defs/Sha256'}
  schemas:
    BatchResponse:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items: {$ref: '../schemas/IngestResult.json'}
        summary:
          type: object
          required: [created, updated, unchanged, deleted, errors]
          properties:
            created: {type: integer, minimum: 0}
            updated: {type: integer, minimum: 0}
            unchanged: {type: integer, minimum: 0}
            deleted: {type: integer, minimum: 0}
            errors: {type: integer, minimum: 0}
    ImagesManifest:
      type: array
      maxItems: 100000
      description: Images already uploaded as blobs. `file` is the image file name the canonical filename pattern and assets.csv refer to. Unknown sha256 -> row error `blob_missing`.
      items:
        type: object
        required: [file, sha256]
        properties:
          file:
            type: string
            maxLength: 255
          sha256: {$ref: '../schemas/Common.json#/$defs/Sha256'}
          width: {type: integer, minimum: 1}
          height: {type: integer, minimum: 1}
          renditions:
            type: object
            description: Client-generated renditions (required on nodes without server-side renditions).
            additionalProperties: false
            properties:
              web: {$ref: '#/components/schemas/BlobRef'}
              square: {$ref: '#/components/schemas/BlobRef'}
              thumb: {$ref: '#/components/schemas/BlobRef'}
    BlobRef:
      type: object
      required: [sha256, width, height]
      properties:
        sha256: {$ref: '../schemas/Common.json#/$defs/Sha256'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    ImportOptions:
      type: object
      properties:
        mode:
          type: string
          enum: [upsert, mirror]
          default: upsert
          description: mirror also unpublishes products of the brands present in the file that the file does not contain.
        allow_mass_unpublish:
          type: boolean
          default: false
          description: Without it a mirror import that would unpublish more than half of those products fails with mass_unpublish_refused.
        dry_run:
          type: boolean
          default: false
          description: Validate and report only; write nothing.
        default_language:
          description: Language of un-suffixed text columns (name, description, color_name). Default = the node's first language.
          $ref: '../schemas/Common.json#/$defs/LanguageTag'
  responses:
    Record:
      description: The stored record.
      headers:
        ETag:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '../schemas/IngestRecord.json'}
    Result:
      description: Operation result (updated, unchanged or deleted).
      headers:
        ETag:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '../schemas/IngestResult.json'}
    ResultCreated:
      description: Created.
      headers:
        ETag:
          schema: {type: string}
        Location:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '../schemas/IngestResult.json'}
    BadRequest:
      description: '`invalid_request` (malformed JSON/NDJSON/multipart) or `limit_exceeded`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Unauthorized:
      description: '`unauthorized`, `invalid_token` or `access_revoked` (token revoked or expired).'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Forbidden:
      description: '`insufficient_scope` or `forbidden` (brand outside the token restriction).'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    NotFound:
      description: '`not_found`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    Conflict:
      description: '`conflict`, `gtin_conflict`, `position_conflict` or `upload_incomplete`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    PreconditionFailed:
      description: '`precondition_failed` (If-Match did not match).'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    PayloadTooLarge:
      description: '`payload_too_large`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    UnsupportedMediaType:
      description: '`unsupported_media_type`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    ValidationFailed:
      description: '`validation_failed`, `invalid_gtin`, `unknown_parent`, `blob_missing`, `checksum_mismatch` or `files_missing`.'
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
    TooManyRequests:
      description: '`rate_limited`.'
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '../schemas/Problem.json'}
