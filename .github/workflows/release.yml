name: release
# Runs when a maintainer pushes a version tag (vX.Y.Z or vX.Y.Z-rc.N). Builds the spec
# bundle, SBOM and checksums from the tagged commit and attaches them to a DRAFT GitHub
# release; a maintainer reviews and publishes it by hand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::tag $GITHUB_REF_NAME, package.json says $want"; exit 1; fi
      - run: npm run check
      - run: npm run package
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::no CHANGELOG.md section for $v"; exit 1; }
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag \
            --title "Open Brand Exchange specification ${GITHUB_REF_NAME}" --notes-file dist/notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sbom.cdx.json dist/SHA256SUMS
