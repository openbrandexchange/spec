extends:
  - recommended
apis:
  protocol:
    root: openapi/obx-protocol.yaml
  ingest:
    root: openapi/obx-ingest.yaml
  admin:
    root: openapi/node-admin.yaml
rules:
  # Tokens and signed URLs are documented per operation; a security requirement per operation is intended.
  operation-4xx-response: error
  info-license-strict: error
  no-server-example.com: warn
  # Redocly cannot resolve the $id-relative refs of our JSON Schemas when it checks
  # examples; tools/validate.mjs validates every OpenAPI example with Ajv instead.
  no-invalid-media-type-examples: off
